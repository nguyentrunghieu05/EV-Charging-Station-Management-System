<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVCS - Quét mã bắt đầu sạc</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background:#f5f7fa}
        .navbar{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}
        .container{max-width:800px;margin:30px auto;padding:0 20px}
        .card{background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
        .card h2{margin-bottom:20px;color:#333}
        .scan-section{display:flex;flex-direction:column;align-items:center;gap:20px}
        .qr-placeholder{width:250px;height:250px;border:2px dashed #667eea;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f8f9ff;margin:20px 0}
        .qr-placeholder .icon{font-size:48px;color:#667eea}
        .input-group{width:100%;max-width:400px;margin:20px 0}
        .input-group label{display:block;margin-bottom:8px;font-weight:600;color:#333}
        .input-group input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;transition:border-color 0.3s}
        .input-group input:focus{outline:none;border-color:#667eea}
        .btn{padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all 0.3s;margin:10px}
        .btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(102,126,234,0.4)}
        .btn-secondary{background:#f0f0f0;color:#666}
        .btn-secondary:hover{background:#e0e0e0}
        .btn:disabled{background:#ccc;cursor:not-allowed;transform:none}
        .alert{padding:15px;border-radius:8px;margin:15px 0;text-align:left}
        .alert.success{background:#e8f5e9;color:#2e7d32}
        .alert.error{background:#ffebee;color:#c62828}
        .alert.info{background:#e3f2fd;color:#1565c0}
        .divider{margin:30px 0;height:1px;background:#eee;position:relative}
        .divider::before{content:'HOẶC';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 15px;color:#666;font-size:14px}
        .session-info{background:#f8f9ff;padding:20px;border-radius:8px;margin:20px 0;text-align:left}
        .session-info h3{margin-bottom:15px;color:#667eea}
        .info-row{display:flex;justify-content:space-between;margin:8px 0;padding:5px 0;border-bottom:1px solid #eee}
        .info-row:last-child{border-bottom:none}
        .loading{display:none;text-align:center;padding:20px}
        .spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .hidden{display:none}
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>⚡ EVCS - Quét mã bắt đầu sạc</h1>
        <div>
            <a href="home.html" style="color:#fff;text-decoration:none;margin-right:10px">Trang chủ</a>
            <a href="sessions.html" style="color:#fff;text-decoration:none">Lịch sử</a>
        </div>
    </nav>

    <div class="container">
        <div id="message"></div>
        
        <div class="card" id="scanCard">
            <h2>Bắt đầu phiên sạc</h2>
            <p>Quét mã QR tại trạm sạc hoặc dùng đặt chỗ để khởi động</p>
            
            <div class="scan-section">
                <div class="qr-placeholder" id="qrPlaceholder">
                    <div class="icon">📷</div>
                </div>
                <button class="btn btn-primary" onclick="startScan()">Bật camera quét mã</button>
                <button class="btn btn-secondary" onclick="selectFromGallery()">Chọn ảnh từ thư viện</button>
            </div>
            
            <div class="divider"></div>
            
            <div class="input-group">
                <label>Đặt chỗ hiện tại:</label>
                <div id="reservationSummary" style="text-align:left;color:#555"></div>
                <button class="btn btn-primary" id="startFromReservationBtn" onclick="startFromReservation()" disabled>Bắt đầu sạc từ đặt chỗ</button>
            </div>
        </div>

        <div class="card hidden" id="sessionCard">
            <h2>Thông tin phiên sạc</h2>
            <div class="session-info" id="sessionInfo">
                <!-- Session info will be displayed here -->
            </div>
            <div class="loading" id="loadingSection">
                <div class="spinner"></div>
                <p>Đang khởi động phiên sạc...</p>
            </div>
            <div style="margin-top:20px">
                <button class="btn btn-primary" onclick="confirmStartSession()">Xác nhận bắt đầu sạc</button>
                <button class="btn btn-secondary" onclick="cancelSession()">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('accessToken');
        let user = JSON.parse(localStorage.getItem('user') || '{}');
        let currentSession = null;
        let currentReservation = null;
        let scanStream = null;

        if (!token) {
            window.location.href = 'auth.html';
        }

        function showAlert(message, type = 'info') {
            const alertDiv = document.getElementById('message');
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        async function refreshAccessToken() {
            try {
                const res = await fetch(`${API_BASE}/auth/refresh`, { method: 'POST' });
                if (!res.ok) return false;
                const data = await res.json();
                if (data && data.accessToken) {
                    localStorage.setItem('accessToken', data.accessToken);
                    token = data.accessToken;
                    return true;
                }
                return false;
            } catch { return false; }
        }

        async function fetchWithAuth(url, options = {}) {
            const opts = Object.assign({}, options);
            opts.headers = Object.assign({}, opts.headers, { 'Authorization': `Bearer ${token}` });
            let res = await fetch(url, opts);
            if (res.status === 401 || res.status === 403) {
                if (await refreshAccessToken()) {
                    opts.headers['Authorization'] = `Bearer ${token}`;
                    res = await fetch(url, opts);
                } else {
                    // If refresh fails, redirect to login
                    window.location.href = 'auth.html';
                    return new Response(null, { status: 401 });
                }
            }
            return res;
        }

        // QR Code scanning functionality
        function startScan() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showAlert('Trình duyệt không hỗ trợ camera', 'error');
                return;
            }

            const qrPlaceholder = document.getElementById('qrPlaceholder');
            qrPlaceholder.innerHTML = '<div class="spinner"></div><p>Đang khởi động camera...</p>';

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    scanStream = stream;
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'cover';
                    
                    qrPlaceholder.innerHTML = '';
                    qrPlaceholder.appendChild(video);
                    
                    // Simulate QR code detection (in real app, use QR scanning library)
                    setTimeout(() => {
                        const mockSessionCode = 'SES-' + Math.floor(100000 + Math.random() * 900000);
                        showAlert(`Đã quét được mã: ${mockSessionCode}`, 'success');
                        stopScan();
                        document.getElementById('sessionCode').value = mockSessionCode;
                        startSessionByCode();
                    }, 3000);
                })
                .catch(err => {
                    showAlert('Không thể truy cập camera: ' + err.message, 'error');
                    qrPlaceholder.innerHTML = '<div class="icon">📷</div>';
                });
        }

        function stopScan() {
            if (scanStream) {
                scanStream.getTracks().forEach(track => track.stop());
                scanStream = null;
            }
            const qrPlaceholder = document.getElementById('qrPlaceholder');
            qrPlaceholder.innerHTML = '<div class="icon">📷</div>';
        }

        function selectFromGallery() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) {
                    showAlert('Vui lòng chọn một tập tin ảnh', 'error');
                    return;
                }
                
                // VALIDATION: Check file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    showAlert('Kích thước ảnh không được vượt quá 5MB', 'error');
                    return;
                }
                
                // VALIDATION: Check file type
                if (!file.type.startsWith('image/')) {
                    showAlert('Vui lòng chọn một tệp hình ảnh hợp lệ', 'error');
                    return;
                }
                
                // Simulate QR code detection from image
                const mockSessionCode = 'SES-' + Math.floor(100000 + Math.random() * 900000);
                showAlert(`Đã đọc được mã từ ảnh: ${mockSessionCode}`, 'success');
                document.getElementById('sessionCode').value = mockSessionCode;
                startSessionByCode();
            };
            input.click();
        }

        // Bắt đầu phiên từ đặt chỗ
        async function startFromReservation() {
            if (!currentReservation) {
                showAlert('Không có thông tin đặt chỗ hợp lệ', 'error');
                return;
            }

            try {
                showAlert('Đang khởi động phiên sạc từ đặt chỗ...', 'info');
                const res = await fetchWithAuth(`${API_BASE}/sessions/start-from-reservation/${currentReservation.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vehicleId: currentReservation.vehicleId || null })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({ message: 'Không thể bắt đầu phiên sạc' }));
                    throw new Error(err.message);
                }
                const sessionData = await res.json();
                showAlert('Đã bắt đầu phiên sạc!', 'success');
                setTimeout(() => {
                    window.location.href = `charging.html?sessionId=${sessionData.id}`;
                }, 1200);
            } catch (e) {
                showAlert(e.message, 'error');
            }
        }

        function displaySessionInfo() {
            if (!currentSession) return;

            const sessionInfo = document.getElementById('sessionInfo');
            sessionInfo.innerHTML = `
                <h3>Thông tin phiên sạc</h3>
                <div class="info-row">
                    <span>Mã phiên:</span>
                    <span><strong>${currentSession.code || currentSession.id}</strong></span>
                </div>
                <div class="info-row">
                    <span>Trạm sạc:</span>
                    <span>${currentSession.stationName || 'N/A'}</span>
                </div>
                <div class="info-row">
                    <span>Connector:</span>
                    <span>${currentSession.connectorType || 'N/A'}</span>
                </div>
                <div class="info-row">
                    <span>Công suất:</span>
                    <span>${currentSession.power || 'N/A'} kW</span>
                </div>
                <div class="info-row">
                    <span>Trạng thái:</span>
                    <span style="color: ${getStatusColor(currentSession.status)}">${getStatusText(currentSession.status)}</span>
                </div>
                ${currentSession.reservedBy ? `
                <div class="info-row">
                    <span>Đã đặt bởi:</span>
                    <span>${currentSession.reservedBy}</span>
                </div>
                ` : ''}
            `;
        }

        function getStatusColor(status) {
            switch (status?.toUpperCase()) {
                case 'AVAILABLE': return '#2e7d32';
                case 'OCCUPIED': return '#f57c00';
                case 'RESERVED': return '#1565c0';
                case 'MAINTENANCE': return '#c62828';
                default: return '#666';
            }
        }

        function getStatusText(status) {
            switch (status?.toUpperCase()) {
                case 'AVAILABLE': return 'Khả dụng';
                case 'OCCUPIED': return 'Đang sử dụng';
                case 'RESERVED': return 'Đã đặt';
                case 'MAINTENANCE': return 'Bảo trì';
                default: return 'Không xác định';
            }
        }

        async function confirmStartSession() {
            if (!currentSession) {
                showAlert('Không có thông tin phiên sạc', 'error');
                return;
            }

            const loadingSection = document.getElementById('loadingSection');
            loadingSection.style.display = 'block';

            try {
                const res = await fetchWithAuth(`${API_BASE}/sessions/${currentSession.code}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.id,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!res.ok) {
                    if (res.status === 404) {
                        throw new Error('Không tìm thấy phiên sạc');
                    } else if (res.status === 403) {
                        throw new Error('Bạn không có quyền khởi động phiên này');
                    } else if (res.status === 400) {
                        const error = await res.json().catch(() => ({ message: 'Dữ liệu không hợp lệ' }));
                        throw new Error(error.message || 'Không thể khởi động phiên sạc');
                    } else {
                        const error = await res.json().catch(() => ({ message: 'Lỗi server' }));
                        throw new Error(error.message || 'Không thể khởi động phiên sạc');
                    }
                }

                const sessionData = await res.json();
                showAlert('Phiên sạc đã được khởi động thành công!', 'success');
                
                // Redirect to charging session tracking page
                setTimeout(() => {
                    window.location.href = `charging.html?sessionId=${sessionData.id}`;
                }, 2000);

            } catch (err) {
                showAlert(err.message, 'error');
                loadingSection.style.display = 'none';
            }
        }

        function cancelSession() {
            currentSession = null;
            document.getElementById('sessionCard').classList.add('hidden');
            document.getElementById('scanCard').classList.remove('hidden');
            document.getElementById('sessionCode').value = '';
            stopScan();
        }

        // Check for existing reservations when page loads
        window.addEventListener('load', async () => {
            // Check if user is logged in first
            if (!token || !user.id) {
                window.location.href = 'auth.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const reservationId = urlParams.get('reservationId');
            const connectorId = urlParams.get('connectorId');
            
            if (reservationId) {
                try {
                    const res = await fetchWithAuth(`${API_BASE}/reservations/${reservationId}`);
                    if (res.ok) {
                        const reservation = await res.json();
                        currentReservation = reservation;
                        const sumDiv = document.getElementById('reservationSummary');
                        sumDiv.innerHTML = `
                            <div><strong>Mã đặt chỗ:</strong> ${reservation.id}</div>
                            <div><strong>Connector:</strong> ${reservation.connectorId}</div>
                            <div><strong>Thời gian:</strong> ${reservation.startWindow || ''} → ${reservation.endWindow || ''}</div>
                            <div id="qrImageWrap" style="margin-top:10px"></div>
                        `;
                        // Hiển thị QR cho connector
                        const qrRes = await fetchWithAuth(`${API_BASE}/sessions/reservation/${reservationId}/qr`);
                        if (qrRes.ok) {
                            const qr = await qrRes.json();
                            const img = document.createElement('img');
                            img.src = `data:image/png;base64,${qr.qr}`;
                            img.alt = 'QR phiên sạc';
                            img.style.width = '180px';
                            img.style.height = '180px';
                            document.getElementById('qrImageWrap').appendChild(img);
                        }
                        document.getElementById('startFromReservationBtn').disabled = false;
                        showAlert('Đã tải đặt chỗ và QR của connector. Bạn có thể bắt đầu sạc.', 'success');
                    } else if (res.status === 404) {
                        showAlert('Không tìm thấy đặt chỗ này', 'warning');
                    } else {
                        showAlert('Không thể tải thông tin đặt chỗ', 'error');
                    }
                } catch (err) {
                    console.error('Error loading reservation:', err);
                    showAlert('Lỗi kết nối server', 'error');
                }
            }

            if (connectorId) {
                try {
                    const res = await fetchWithAuth(`${API_BASE}/sessions/start-by-connector/${connectorId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ vehicleId: null })
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ message: 'Không thể bắt đầu phiên sạc' }));
                        throw new Error(err.message);
                    }
                    const sessionData = await res.json();
                    showAlert('Đã bắt đầu phiên sạc!', 'success');
                    setTimeout(() => {
                        window.location.href = `charging.html?sessionId=${sessionData.id}`;
                    }, 1200);
                } catch (e) {
                    showAlert(e.message, 'error');
                }
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopScan();
        });
    </script>
</body>
</html>
