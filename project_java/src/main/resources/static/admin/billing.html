<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💳 Quản lý Thanh toán - EVCS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">
    <nav class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">💳 Quản lý Thanh toán & Hóa đơn</h1>
            <a href="dashboard.html" class="bg-white/20 px-4 py-2 rounded hover:bg-white/30 transition">← Quay lại
                Dashboard</a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Tổng hóa đơn</h3>
                <p class="text-3xl font-bold text-purple-600" id="totalInvoices">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Đã thanh toán</h3>
                <p class="text-3xl font-bold text-green-600" id="paidInvoices">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Chưa thanh toán</h3>
                <p class="text-3xl font-bold text-yellow-600" id="unpaidInvoices">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Tổng doanh thu</h3>
                <p class="text-3xl font-bold text-blue-600" id="totalAmount">0 VNĐ</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">Trạng thái</label>
                    <select id="statusFilter" onchange="loadInvoices()" class="w-full border rounded px-3 py-2">
                        <option value="">Tất cả</option>
                        <option value="PAID">Đã thanh toán</option>
                        <option value="UNPAID">Chưa thanh toán</option>
                        <option value="PENDING">Đang xử lý</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Từ ngày</label>
                    <input type="date" id="fromDate" onchange="loadInvoices()" class="w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Đến ngày</label>
                    <input type="date" id="toDate" onchange="loadInvoices()" class="w-full border rounded px-3 py-2">
                </div>
                <div class="flex items-end">
                    <button onclick="loadInvoices()"
                        class="w-full bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition">
                        🔍 Tìm kiếm
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-6 border-b">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">Danh sách Hóa đơn</h2>
                    <button onclick="exportInvoices()"
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
                        📥 Xuất Excel
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-3 text-left text-sm font-semibold">Mã HĐ</th>
                            <th class="p-3 text-left text-sm font-semibold">Khách hàng</th>
                            <th class="p-3 text-left text-sm font-semibold">Session ID</th>
                            <th class="p-3 text-left text-sm font-semibold">Số tiền</th>
                            <th class="p-3 text-left text-sm font-semibold">Trạng thái</th>
                            <th class="p-3 text-left text-sm font-semibold">Ngày tạo</th>
                            <th class="p-3 text-left text-sm font-semibold">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTable">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-500">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                <div class="text-sm text-gray-600">
                    Hiển thị <span id="showingCount">0</span> hóa đơn
                </div>
                <div class="flex gap-2">
                    <button onclick="previousPage()" class="px-3 py-1 border rounded hover:bg-gray-100">← Trước</button>
                    <button onclick="nextPage()" class="px-3 py-1 border rounded hover:bg-gray-100">Sau →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('accessToken');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || user.type !== 'ADMIN') {
            alert('Bạn không có quyền truy cập trang này');
            window.location.href = '../auth.html';
        }

        let currentPage = 1;
        const pageSize = 20;

        const today = new Date().toISOString().slice(0, 10);
        const lastMonth = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
        document.getElementById('fromDate').value = lastMonth;
        document.getElementById('toDate').value = today;

        async function loadInvoices() {
            try {
                const status = document.getElementById('statusFilter').value;
                const from = document.getElementById('fromDate').value;
                const to = document.getElementById('toDate').value;

                let url = `/api/invoices?page=${currentPage}&size=${pageSize}`;
                if (status) url += `&status=${status}`;
                if (from) url += `&from=${from}`;
                if (to) url += `&to=${to}`;

                let res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    console.log('Invoices API not available, trying sessions...');
                    url = `/api/sessions`;
                    res = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!res.ok) {
                        throw new Error('API not available');
                    }

                    const sessions = await res.json();
                    displaySessionsAsInvoices(sessions);
                    return;
                }

                const invoices = await res.json();
                displayInvoices(invoices);

            } catch (err) {
                console.error('Error:', err);
                document.getElementById('invoicesTable').innerHTML = `
                    <tr>
                        <td colspan="7" class="p-8 text-center">
                            <p class="text-orange-500 mb-2">⚠️ API hóa đơn chưa sẵn sàng</p>
                            <p class="text-gray-500 text-sm">Chức năng đang được phát triển.</p>
                        </td>
                    </tr>
                `;

                document.getElementById('totalInvoices').textContent = '0';
                document.getElementById('paidInvoices').textContent = '0';
                document.getElementById('unpaidInvoices').textContent = '0';
                document.getElementById('totalAmount').textContent = '0 VNĐ';
                document.getElementById('showingCount').textContent = '0';
            }
        }

        function displayInvoices(invoices) {
            const totalInvoices = invoices.length;
            const paidCount = invoices.filter(inv => inv.status === 'PAID').length;
            const unpaidCount = invoices.filter(inv => inv.status === 'UNPAID').length;
            const totalAmount = invoices.reduce((sum, inv) => sum + (inv.totalAmount || 0), 0);

            document.getElementById('totalInvoices').textContent = totalInvoices;
            document.getElementById('paidInvoices').textContent = paidCount;
            document.getElementById('unpaidInvoices').textContent = unpaidCount;
            document.getElementById('totalAmount').textContent =
                new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(totalAmount);
            document.getElementById('showingCount').textContent = totalInvoices;

            const tableBody = document.getElementById('invoicesTable');

            if (invoices.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-8 text-center text-gray-500">Không tìm thấy hóa đơn nào</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = invoices.map(invoice => {
                const statusColors = {
                    'PAID': 'bg-green-100 text-green-800',
                    'UNPAID': 'bg-red-100 text-red-800',
                    'PENDING': 'bg-yellow-100 text-yellow-800'
                };

                const statusColor = statusColors[invoice.status] || 'bg-gray-100 text-gray-800';

                return `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 text-sm font-mono">${invoice.id.substring(0, 8)}...</td>
                        <td class="p-3 text-sm">${invoice.userName || 'N/A'}</td>
                        <td class="p-3 text-sm font-mono">${invoice.sessionId ? invoice.sessionId.substring(0, 8) + '...' : 'N/A'}</td>
                        <td class="p-3 text-sm font-semibold">
                            ${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(invoice.totalAmount || 0)}
                        </td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded-full text-xs font-semibold ${statusColor}">
                                ${invoice.status}
                            </span>
                        </td>
                        <td class="p-3 text-sm">${new Date(invoice.createdAt).toLocaleDateString('vi-VN')}</td>
                        <td class="p-3">
                            <button onclick="viewInvoice('${invoice.id}')" 
                                class="text-blue-600 hover:text-blue-800 text-sm font-semibold">
                                👁️ Xem
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function displaySessionsAsInvoices(sessions) {
            const tableBody = document.getElementById('invoicesTable');

            if (!sessions || sessions.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-8 text-center text-gray-500">Chưa có dữ liệu</td>
                    </tr>
                `;
                return;
            }

            const completedSessions = sessions.filter(s => s.status === 'COMPLETED');

            document.getElementById('totalInvoices').textContent = completedSessions.length;
            document.getElementById('paidInvoices').textContent = completedSessions.length;
            document.getElementById('showingCount').textContent = completedSessions.length;

            const totalAmount = completedSessions.reduce((sum, s) => sum + (s.totalCost || 0), 0);
            document.getElementById('totalAmount').textContent =
                new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(totalAmount);

            tableBody.innerHTML = completedSessions.map(session => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 text-sm font-mono">${session.id.substring(0, 8)}...</td>
                    <td class="p-3 text-sm">${session.userName || 'N/A'}</td>
                    <td class="p-3 text-sm font-mono">${session.id.substring(0, 8)}...</td>
                    <td class="p-3 text-sm font-semibold">
                        ${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(session.totalCost || 0)}
                    </td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800">
                            PAID
                        </span>
                    </td>
                    <td class="p-3 text-sm">${new Date(session.endTime).toLocaleDateString('vi-VN')}</td>
                    <td class="p-3">
                        <button onclick="viewInvoice('${session.id}')" 
                            class="text-blue-600 hover:text-blue-800 text-sm font-semibold">
                            👁️ Xem
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function viewInvoice(id) {
            window.location.href = `../invoice.html?id=${id}`;
        }

        function exportInvoices() {
            alert('Chức năng xuất Excel đang được phát triển');
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadInvoices();
            }
        }

        function nextPage() {
            currentPage++;
            loadInvoices();
        }

        loadInvoices();
    </script>
</body>

</html>
