<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ Quản lý Sự cố - EVCS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">
    <nav class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">⚠️ Quản lý Sự cố (Incident Tickets)</h1>
            <a href="dashboard.html" class="bg-white/20 px-4 py-2 rounded hover:bg-white/30 transition">← Quay lại
                Dashboard</a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Tổng sự cố</h3>
                <p class="text-3xl font-bold text-purple-600" id="totalIncidents">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Đang xử lý</h3>
                <p class="text-3xl font-bold text-yellow-600" id="inProgressIncidents">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Đã giải quyết</h3>
                <p class="text-3xl font-bold text-green-600" id="resolvedIncidents">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-gray-600 text-sm font-semibold">Mới báo cáo</h3>
                <p class="text-3xl font-bold text-red-600" id="reportedIncidents">0</p>
            </div>
        </div>

        <!-- Incidents List -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Danh sách Sự cố</h2>
                <button onclick="loadIncidents()"
                    class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition">
                    🔄 Tải lại
                </button>
            </div>

            <div id="incidentsList" class="space-y-4">
                <p class="text-gray-500 text-center py-8">Đang tải dữ liệu...</p>
            </div>
        </div>
    </div>

    <script>
        // Check admin auth
        const token = localStorage.getItem('accessToken');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || user.type !== 'ADMIN') {
            alert('Bạn không có quyền truy cập trang này');
            window.location.href = '../auth.html';
        }

        // Load incidents from API
        async function loadIncidents() {
            try {
                const res = await fetch('/api/incidents', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to load incidents');

                const incidents = await res.json();

                // Update stats
                document.getElementById('totalIncidents').textContent = incidents.length;
                document.getElementById('reportedIncidents').textContent =
                    incidents.filter(i => i.status === 'REPORTED').length;
                document.getElementById('inProgressIncidents').textContent =
                    incidents.filter(i => i.status === 'IN_PROGRESS').length;
                document.getElementById('resolvedIncidents').textContent =
                    incidents.filter(i => i.status === 'RESOLVED').length;

                // Display incidents
                const listContainer = document.getElementById('incidentsList');

                if (incidents.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-12">
                            <p class="text-gray-500 text-lg">✅ Chưa có sự cố nào được báo cáo</p>
                            <p class="text-gray-400 text-sm mt-2">Hệ thống đang hoạt động tốt!</p>
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = incidents.map(incident => {
                    const statusColors = {
                        'REPORTED': 'bg-red-100 text-red-800',
                        'IN_PROGRESS': 'bg-yellow-100 text-yellow-800',
                        'RESOLVED': 'bg-green-100 text-green-800',
                        'CLOSED': 'bg-gray-100 text-gray-800'
                    };

                    const priorityColors = {
                        'LOW': 'text-blue-600',
                        'MEDIUM': 'text-yellow-600',
                        'HIGH': 'text-orange-600',
                        'CRITICAL': 'text-red-600'
                    };

                    const statusColor = statusColors[incident.status] || 'bg-gray-100 text-gray-800';
                    const priorityColor = priorityColors[incident.priority] || 'text-gray-600';

                    return `
                        <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex-1">
                                    <h3 class="font-bold text-lg">${incident.title || 'Sự cố #' + incident.id}</h3>
                                    <p class="text-sm text-gray-600 mt-1">${incident.description || 'Không có mô tả'}</p>
                                </div>
                                <div class="flex gap-2">
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColor}">
                                        ${incident.status}
                                    </span>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${priorityColor} bg-gray-50">
                                        ${incident.priority}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-3 text-sm">
                                <div>
                                    <span class="text-gray-500">Trạm:</span>
                                    <span class="font-medium">${incident.stationName || 'N/A'}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500">Người báo cáo:</span>
                                    <span class="font-medium">${incident.reporterName || 'N/A'}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500">Ngày báo cáo:</span>
                                    <span class="font-medium">${new Date(incident.reportedAt).toLocaleDateString('vi-VN')}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500">Người xử lý:</span>
                                    <span class="font-medium">${incident.assignedToName || 'Chưa phân công'}</span>
                                </div>
                            </div>
                            
                            <div class="mt-3 flex gap-2">
                                <button onclick="viewIncident('${incident.id}')" 
                                    class="text-sm bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition">
                                    👁️ Chi tiết
                                </button>
                                ${incident.status !== 'RESOLVED' ? `
                                    <button onclick="updateStatus('${incident.id}', 'IN_PROGRESS')" 
                                        class="text-sm bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600 transition">
                                        🔧 Xử lý
                                    </button>
                                    <button onclick="updateStatus('${incident.id}', 'RESOLVED')" 
                                        class="text-sm bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 transition">
                                        ✅ Giải quyết
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error loading incidents:', err);
                document.getElementById('incidentsList').innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-red-500 text-lg">❌ Lỗi tải dữ liệu</p>
                        <p class="text-gray-500 text-sm mt-2">${err.message}</p>
                        <button onclick="loadIncidents()" class="mt-4 bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                            Thử lại
                        </button>
                    </div>
                `;
            }
        }

        function viewIncident(id) {
            alert('Xem chi tiết sự cố: ' + id + '\n(Chức năng đang phát triển)');
        }

        async function updateStatus(id, newStatus) {
            if (!confirm(`Cập nhật trạng thái thành ${newStatus}?`)) return;

            try {
                const res = await fetch(`/api/incidents/${id}/status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!res.ok) throw new Error('Failed to update status');

                alert('✅ Cập nhật thành công!');
                loadIncidents();
            } catch (err) {
                alert('❌ Lỗi: ' + err.message);
            }
        }

        // Auto-load on page ready
        loadIncidents();
    </script>
</body>

</html>
